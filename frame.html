<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Frame - Daarul Azmi Twibbon Studio</title>
  <meta name="description" content="Pilih frame Twibbon untuk kampanye.">
  
  <link rel="icon" href="assets/logo/logo.png" type="image/png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a5d1a">
  
  <style>
    .frame-preview-page {
      min-height: calc(100vh - 200px);
      padding: 2rem 0;
    }
    
    .frame-preview-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .frame-preview-header h1 {
      font-size: 1.8rem;
      color: #1a5d1a;
      margin-bottom: 0.5rem;
    }
    
    .frame-preview-header p {
      color: #666;
      font-size: 1rem;
    }
    
    .frames-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    
    .frame-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    
    .frame-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    
    .frame-card-image {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #f5f5f5;
      overflow: hidden;
    }
    
    .frame-card-image img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .frame-card-image .placeholder-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a5d1a 0%, #2d8e2d 100%);
      color: white;
      font-size: 3rem;
    }
    
    .frame-card-body {
      padding: 1rem;
      text-align: center;
    }
    
    .frame-card-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
    }
    
    .frame-card-btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #1a5d1a;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    
    .frame-card-btn:hover {
      background: #2d8e2d;
    }
    
    .no-frames {
      text-align: center;
      padding: 3rem;
      color: #666;
    }
    
    .no-frames svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    
    @media (max-width: 768px) {
      .frames-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }
      
      .frame-preview-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo/logo.png" alt="Logo Daarul Azmi">
        <div class="logo-text">Twibbon <span>Studio</span></div>
      </a>
      
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
      
      <nav class="nav" id="main-nav">
        <ul class="nav-links">
          <li><a href="index.html">Beranda</a></li>
          <li><a href="kampanye.html">Kampanye</a></li>
          <li><a href="panduan.html">Panduan</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Frame Preview Page -->
  <div class="frame-preview-page">
    <div class="container">
      <div class="frame-preview-header">
        <h1 id="campaign-title">Memuat kampanye...</h1>
        <p id="campaign-description"></p>
      </div>

      <div class="frames-grid" id="frames-grid">
        <div class="spinner"></div>
      </div>

      <div id="no-frames" class="no-frames" style="display: none;">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <h3>Tidak ada frame tersedia</h3>
        <p>Kampanye ini belum memiliki frame yang tersedia. Silakan coba kampanye lain.</p>
        <a href="kampanye.html" class="btn btn-primary" style="margin-top: 1rem;">Kembali ke Kampanye</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2026 Daarul Azmi Twibbon Studio. Hak cipta dilindungi undang-undang.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/campaigns.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const campaignId = urlParams.get('campaign');
      
      if (!campaignId) {
        window.location.href = 'kampanye.html';
        return;
      }
      
      try {
        const campaign = await CampaignsModule.getCampaignById(campaignId);
        
        if (!campaign) {
          window.location.href = 'kampanye.html';
          return;
        }
        
        document.getElementById('campaign-title').textContent = campaign.title;
        document.getElementById('campaign-description').textContent = campaign.description;
        
        const framesGrid = document.getElementById('frames-grid');
        const noFrames = document.getElementById('no-frames');
        
        if (!campaign.frames || campaign.frames.length === 0) {
          framesGrid.style.display = 'none';
          noFrames.style.display = 'block';
          return;
        }
        
        framesGrid.innerHTML = '';
        
        campaign.frames.forEach((frame, index) => {
          const card = document.createElement('div');
          card.className = 'frame-card';
          
          const frameImage = frame.image 
            ? `<img src="${frame.image}" alt="${frame.name}" onerror="this.parentElement.innerHTML='<div class=\\'placeholder-frame\\'>🖼️</div>'">`
            : '<div class="placeholder-frame">🖼️</div>';
          
          card.innerHTML = `
            <div class="frame-card-image">
              ${frameImage}
            </div>
            <div class="frame-card-body">
              <div class="frame-card-name">${frame.name}</div>
              <a href="editor.html?campaign=${campaignId}&frame=${index}" class="frame-card-btn">Pilih Frame</a>
            </div>
          `;
          
          framesGrid.appendChild(card);
        });
        
      } catch (error) {
        console.error('Error loading campaign:', error);
        window.location.href = 'kampanye.html';
      }
    });
  </script>
</body>
</html>
